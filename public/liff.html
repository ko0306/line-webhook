<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OZONOIX</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Hiragino Kaku Gothic ProN",sans-serif;background:#f5f7fa;color:#333;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    .spinner{width:40px;height:40px;border:4px solid #ccc;border-top-color:#06C755;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .center{text-align:center;color:#555;font-size:14px}
    /* テストパネル */
    #test-panel{display:none;background:#fff3cd;border:2px solid #ffc107;border-radius:10px;padding:16px;width:100%;max-width:480px}
    #test-panel h3{color:#856404;margin-bottom:10px;font-size:15px}
    #test-panel p{margin:5px 0;color:#533f03;font-size:13px;word-break:break-all}
    /* 規約・プランページ */
    #plan-page{display:none;width:100%;max-width:480px}
    .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
    h2{font-size:16px;font-weight:bold;color:#06C755;margin-bottom:12px;border-bottom:2px solid #06C755;padding-bottom:6px}
    .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
    .row:last-child{border-bottom:none}
    .label{color:#888;flex-shrink:0;margin-right:8px}
    .value{font-weight:bold;text-align:right;word-break:break-all}
    .btn{display:block;width:100%;padding:13px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;margin-bottom:10px;text-align:center}
    .btn-green{background:#06C755;color:#fff}
    .btn-outline{background:#fff;color:#06C755;border:2px solid #06C755}
    .btn-red{background:#fff;color:#e00;border:2px solid #e00}
    .agreement{font-size:12px;color:#888;text-decoration:underline;display:block;margin:4px 0}
  </style>
</head>
<body>
  <!-- ローディング -->
  <div id="loading" class="center">
    <div class="spinner"></div>
    <p id="loading-msg">認証中です。しばらくお待ちください...</p>
  </div>

  <!-- テストパネル（?testmode=1 で表示） -->
  <div id="test-panel">
    <h3>🧪 テストモード（LINE未接続）</h3>
    <p id="tp-page"></p>
    <p id="tp-action"></p>
    <p id="tp-url"></p>
  </div>

  <!-- 規約・プランページ -->
  <div id="plan-page">
    <div class="card">
      <h2>📋 ご契約情報</h2>
      <div id="info-rows"></div>
    </div>
    <div class="card">
      <h2>📝 同意事項</h2>
      <a class="agreement" href="https://harurururun.github.io/company-OZONONIX/" target="_blank">個人情報保護方針</a>
      <a class="agreement" href="https://harurururun.github.io/company-OZONONIX/" target="_blank">特定商取引法に基づく表記</a>
      <a class="agreement" href="https://harurururun.github.io/company-OZONONIX/" target="_blank">利用規約</a>
    </div>
    <div class="card">
      <h2>⚙️ 操作</h2>
      <button class="btn btn-outline" onclick="sendMsg('情報変更')">情報を変更する</button>
      <button id="plan-change-btn" class="btn btn-outline" onclick="sendMsg('プラン変更')" style="display:none">プランを変更する</button>
      <button class="btn btn-red" onclick="sendMsg('退会手続き')">退会はこちら</button>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzsGl4-KTvsnb1domHoUeon7E7qT8-K8eLe8AbyvTy1O7Sea7lc_AzqrZgb4_OSd8gB/exec';
    const LIFF_ID = '2009734205-wWWdTXIP';
    const OA_ID = '152nnfoc'; // LINE公式アカウントID（@なし）

    const urlParams = new URLSearchParams(window.location.search);
    const TEST_MODE = urlParams.get('testmode') === '1';

    // URLパラメータ取得（liff.state経由のリダイレクトにも対応）
    function getPage() {
      // 直接パラメータを確認
      const direct = urlParams.get('page');
      if (direct === 'plan' || direct === 'free') return direct;

      // LIFFログイン後のリダイレクトで page が liff.state に入る場合
      const liffState = urlParams.get('liff.state');
      if (liffState) {
        const decoded = decodeURIComponent(liffState);
        const inner = new URLSearchParams(decoded.startsWith('?') ? decoded.slice(1) : decoded);
        const innerPage = inner.get('page');
        if (innerPage === 'plan' || innerPage === 'free') return innerPage;
      }

      return 'auth';
    }

    function sendMsg(text) {
      liff.sendMessages([{ type: 'text', text }])
        .then(() => liff.closeWindow())
        .catch(err => alert('エラーが発生しました: ' + err.message));
    }

    // チャットコンテキストがある場合は自動送信、ない場合はOAチャットへ誘導
    async function autoSendOrOpen(text) {
      const context = liff.getContext();
      const hasChatContext = context && context.type !== 'none';

      if (hasChatContext) {
        await liff.sendMessages([{ type: 'text', text }]);
        liff.closeWindow();
      } else {
        // LINE外から開いた場合 → OAチャットを開いてテキストをセット
        window.location.href =
          `https://line.me/R/oaMessage/%40${OA_ID}?text=${encodeURIComponent(text)}`;
      }
    }

    // ===== テストモード（?testmode=1）: LINEなしでブラウザから動作確認 =====
    if (TEST_MODE) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('test-panel').style.display = 'block';

      const page = getPage();
      const actionMap = {
        free: '「無料相談」を送信 → 無料相談フロー開始',
        plan: '規約・プランページを表示',
        auth: '「メール認証」を送信 → メールアドレス確認',
      };

      document.getElementById('tp-page').textContent    = '検出ページ: ' + page;
      document.getElementById('tp-action').textContent  = '実行内容: ' + actionMap[page];
      document.getElementById('tp-url').textContent     = 'URL: ' + window.location.href;

    // ===== 通常モード =====
    } else {
      liff.init({ liffId: LIFF_ID })
        .then(async () => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          const page = getPage();

          if (page === 'free') {
            await autoSendOrOpen('無料相談');
            return;
          }

          if (page === 'plan') {
            const userId = liff.getContext().userId;
            const res = await fetch(GAS_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'getUserInfo', lineUserId: userId }),
            });
            const data = await res.json();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('plan-page').style.display = 'block';

            if (data.success && !data.withdrawn) {
              const rows = [
                ['メールアドレス', data.email],
                ['ご利用サービス', data.inquiry],
                data.plan  ? ['プラン', data.plan]            : null,
                data.trial ? ['無料トライアル', data.trial]   : null,
                data.budget? ['ご予算', data.budget]          : null,
              ].filter(Boolean);

              document.getElementById('info-rows').innerHTML = rows
                .map(([k, v]) => `<div class="row"><span class="label">${k}</span><span class="value">${v || '未設定'}</span></div>`)
                .join('');

              if (data.inquiry && data.inquiry.includes('シフト')) {
                document.getElementById('plan-change-btn').style.display = 'block';
              }
            } else if (data.withdrawn) {
              document.getElementById('info-rows').innerHTML = '<div class="row"><span>退会済みのアカウントです。</span></div>';
            } else {
              document.getElementById('info-rows').innerHTML = '<div class="row"><span>ご契約情報が見つかりません。<br>LINEでメールアドレスをお送りください。</span></div>';
            }

          } else {
            // auth（デフォルト）
            await autoSendOrOpen('メール認証');
          }
        })
        .catch(err => {
          document.getElementById('loading-msg').textContent = 'エラーが発生しました。LINEを開いて操作してください。';
          console.error(err);
        });
    }
  </script>
</body>
</html>
